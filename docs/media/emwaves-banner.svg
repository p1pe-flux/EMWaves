<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="360" viewBox="0 0 1600 360" role="img" aria-labelledby="emwaves-title emwaves-description">
  <title id="emwaves-title">EMWaves</title>
  <desc id="emwaves-description">EMWaves: líneas de transmisión, diagrama de Smith y adaptación de impedancias. El símbolo original de la aplicación acompaña un diagrama de Smith con un punto de carga coral y un recorrido horario sobre su círculo de onda estacionaria. EMWaves: transmission lines, Smith charts, and impedance matching. The original application mark accompanies a Smith chart with a coral load point and clockwise rotation along its standing-wave circle.</desc>
  <defs>
    <clipPath id="smith-disc">
      <circle cx="1326" cy="180" r="142"/>
    </clipPath>
    <marker id="rotation-arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 10 4 0 8Z" fill="#2e686c"/>
    </marker>
  </defs>

  <rect width="1600" height="360" fill="#f5f4ef"/>

  <!-- The same circle, curves, and load-point geometry as App.tsx. -->
  <g transform="translate(82 86) scale(3.8)" fill="none" stroke="#2e686c" stroke-width="1.1" aria-hidden="true">
    <circle cx="20" cy="20" r="17"/>
    <circle cx="28" cy="20" r="9"/>
    <path d="M3 20h34M9 7c0 13 11 13 28 13M9 33c0-13 11-13 28-13"/>
    <circle cx="16" cy="12" r="3" fill="#a95c3f" stroke="#f5f4ef"/>
  </g>

  <text x="270" y="194" font-family="Arial, Helvetica, sans-serif" font-size="104" letter-spacing="-5.2" fill="#2e686c">
    <tspan font-weight="700">EM</tspan><tspan font-weight="300">Waves</tspan>
  </text>
  <g fill="#526f60" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-style="italic">
    <text x="274" y="259">z = Z/Z<tspan baseline-shift="sub" font-size="16">0</tspan></text>
    <path d="M464 239V263" fill="none" stroke="#526f60" stroke-opacity=".32"/>
    <text x="493" y="259">Γ = (z − 1)/(z + 1)</text>
  </g>

  <!-- Exact impedance-chart circles in the physical reflection plane. -->
  <g clip-path="url(#smith-disc)" fill="none" stroke="#526f60" stroke-width="1.1" stroke-opacity=".16" aria-hidden="true">
    <circle cx="1349.666667" cy="180" r="118.333333"/>
    <circle cx="1373.333333" cy="180" r="94.666667"/>
    <circle cx="1397" cy="180" r="71" stroke-opacity=".29"/>
    <circle cx="1420.666667" cy="180" r="47.333333"/>
    <circle cx="1444.333333" cy="180" r="23.666667"/>
    <circle cx="1468" cy="-104" r="284"/>
    <circle cx="1468" cy="464" r="284"/>
    <circle cx="1468" cy="38" r="142"/>
    <circle cx="1468" cy="322" r="142"/>
    <circle cx="1468" cy="109" r="71"/>
    <circle cx="1468" cy="251" r="71"/>
    <circle cx="1468" cy="151.6" r="28.4"/>
    <circle cx="1468" cy="208.4" r="28.4"/>
    <path d="M1184 180H1468" stroke-opacity=".3"/>
  </g>
  <circle cx="1326" cy="180" r="142" fill="none" stroke="#526f60" stroke-width="1.3" stroke-opacity=".43"/>
  <circle cx="1326" cy="180" r="95.256" fill="none" stroke="#547eb1" stroke-width="1.4" stroke-dasharray="4 6" stroke-opacity=".42"/>
  <path d="M1326 180 1411.2 137.4" fill="none" stroke="#526f60" stroke-width="1.15" stroke-dasharray="3 5" stroke-opacity=".4"/>
  <circle cx="1326" cy="180" r="2.5" fill="#526f60" fill-opacity=".55"/>
  <path d="M1411.2 137.4A95.256 95.256 0 0 1 1368.6 265.2" fill="none" stroke="#2e686c" stroke-width="3.3" stroke-linecap="round" marker-end="url(#rotation-arrow)"/>
  <circle cx="1411.2" cy="137.4" r="12" fill="#a95c3f" fill-opacity=".1"/>
  <circle cx="1411.2" cy="137.4" r="6" fill="#a95c3f" stroke="#f5f4ef" stroke-width="2"/>
  <circle cx="1368.6" cy="265.2" r="4" fill="#2e686c" stroke="#f5f4ef" stroke-width="1.5"/>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="20" font-style="italic" paint-order="stroke fill" stroke="#f5f4ef" stroke-width="5" stroke-linejoin="round">
    <text x="1423" y="124" fill="#a95c3f">Γ<tspan baseline-shift="sub" font-size="13">L</tspan></text>
    <text x="1350" y="296" fill="#2e686c">Γ(d)</text>
  </g>
</svg>
