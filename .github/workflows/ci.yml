name: Verify application
on: [push, pull_request]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run check:public
      - run: npm run test:public
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:models
      - run: npm run test:windows-artifacts
      - run: npm run build
      - run: npm run test:desktop
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test
      - name: Prepare Electron's Linux sandbox
        run: |
          # Electron downloads lazily; install the binary before configuring its helper.
          node node_modules/electron/install.js
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          test "$(stat -c '%u:%g:%a' node_modules/electron/dist/chrome-sandbox)" = '0:0:4755'
      - run: dbus-run-session -- xvfb-run -a npm run test:desktop:smoke
      - run: node scripts/package-desktop.mjs linux x64 test-results/desktop-linux
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: application-failures
          path: |
            test-results/browser/
            test-results/desktop-smoke/
            playwright-report/
          retention-days: 7
  native-desktop:
    name: Native ${{ matrix.platform }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: win
            arch: x64
          - os: windows-11-arm
            platform: win
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: macos-15
            platform: mac
            arch: arm64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run check:public
      - run: npm run test:public
      - run: npm test
      - run: npm run test:desktop
      - run: npm run test:windows-artifacts
      - run: npm run icons:desktop
      - run: npm run build
      - name: Prepare Electron's Linux sandbox
        if: runner.os == 'Linux'
        run: |
          node node_modules/electron/install.js
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          test "$(stat -c '%u:%g:%a' node_modules/electron/dist/chrome-sandbox)" = '0:0:4755'
      - name: Exercise native Electron on Linux
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a npm run test:desktop:smoke
      - name: Exercise native Electron on Windows and macOS
        if: runner.os != 'Linux'
        run: npm run test:desktop:smoke
      - name: Verify the native application archive
        run: node scripts/package-desktop.mjs ${{ matrix.platform }} ${{ matrix.arch }} test-results/desktop-${{ matrix.platform }}-${{ matrix.arch }} --dir
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: native-failures-${{ matrix.platform }}-${{ matrix.arch }}
          path: test-results/desktop-smoke/
          retention-days: 7
