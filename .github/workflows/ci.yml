name: Verify application
on: [push, pull_request]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run check:public
      - run: npm run test:public
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:models
      - run: npm run test:windows-artifacts
      - run: npm run build
      - run: npm run test:desktop
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Prepare Electron's Linux sandbox
        run: |
          # Electron downloads lazily; install the binary before configuring its helper.
          node node_modules/electron/install.js
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          test "$(stat -c '%u:%g:%a' node_modules/electron/dist/chrome-sandbox)" = '0:0:4755'
      - run: dbus-run-session -- xvfb-run -a npm run test:desktop:smoke
      - run: node scripts/package-desktop.mjs linux x64 test-results/desktop-linux
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: application-failures
          path: |
            test-results/browser/
            test-results/desktop-smoke/
            playwright-report/
          retention-days: 7
